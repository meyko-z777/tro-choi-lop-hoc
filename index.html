<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7A1018">
<title>Ôn bài cũ - Giáo dục chính trị</title>
<style>
:root{--bg:#FFF7EC;--red:#D7261E;--mar:#7A1018;--gold:#B07D00;--yel:#FFCD00;--ink:#2B1D1D;--mute:#8C7563;--line:#F0DCC8;--green:#2EAD5B;--no:#E04A3A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--mar);color:#fff;font-weight:800}
header .av{width:40px;height:40px;font-size:24px}
header .id{font-size:22px}
header .sp{flex:1}
header .sc{font-size:18px;color:var(--yel)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
main{flex:1;display:flex;flex-direction:column;padding:18px 16px 24px;gap:14px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.big{font-size:30px;font-weight:900;line-height:1.2}
.mute{color:var(--mute);font-weight:600;font-size:17px;line-height:1.45}
.me{width:150px;height:150px;font-size:90px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.num{font-size:64px;font-weight:900;color:var(--red);letter-spacing:.04em}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--gold);font-size:16px}
.tbar{height:10px;background:#fff;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--red);width:100%}
.qtext{font-size:21px;font-weight:800;line-height:1.35;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 14px;border-radius:18px;border:3px solid transparent;background:#fff;font:inherit;font-size:19px;font-weight:800;color:var(--ink);text-align:left;box-shadow:0 5px 0 var(--line);cursor:pointer}
.opt .L{width:44px;height:44px;border-radius:12px;color:#fff;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.opt.sel{border-color:var(--ink);transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt.tf{justify-content:center;font-size:32px;min-height:120px;color:#fff}
.send{font:inherit;font-weight:900;font-size:22px;border:0;border-radius:18px;padding:18px;background:var(--red);color:#fff;box-shadow:0 6px 0 var(--mar)}
.send:disabled{opacity:.4}
.res{font-size:76px}
.ok{color:var(--green)}.bad{color:var(--no)}
.pts{font-size:40px;font-weight:900;color:var(--mar)}
.rank{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 22px;font-weight:800;font-size:20px}
input{font:inherit;font-size:34px;font-weight:900;text-align:center;letter-spacing:.3em;width:220px;padding:12px;border-radius:16px;border:3px solid var(--line)}
.err{color:var(--no);font-weight:700}
.card-pick{width:100%;max-width:420px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.card-pick input{width:100%}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#FFCD00;margin-right:6px}
.dot.live{background:#3BD16F}
#conn{font-size:12px;font-weight:700;opacity:.85;display:flex;align-items:center}
.rcpt{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:20px;padding:10px 18px;border-radius:30px;background:#fff;border:2px solid var(--line)}
.rcpt.ok{color:var(--green);border-color:var(--green)}
.rcpt.warn{color:#C77700;border-color:#F2B705}
.rcpt.bad{color:var(--no);border-color:var(--no)}
#cardBtn{font:inherit;font-weight:800;font-size:14px;color:var(--mute);background:none;border:0;text-decoration:underline;padding:10px;align-self:center}
#cards{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;background:#2B1D1D}
#cards.on{display:flex}
#cards .grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
#cards .grid button{border:0;border-radius:18px;font:inherit;font-weight:900;font-size:64px;color:#fff}
#cards .full{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:40vw;font-weight:900;color:#fff}
#cards .close{font:inherit;font-weight:800;font-size:18px;padding:16px;border:0;background:#fff;color:var(--ink)}
input::placeholder{letter-spacing:.05em;color:#CDB9A6;font-weight:700}
</style></head>
<body>
<header id="hd" style="display:none"><span id="hAv" class="av"></span><span class="id" id="hId"></span><span class="sp"></span><span id="conn"></span><span class="sc" id="hSc" style="margin-left:10px"></span></header>
<main id="app"><div class="center"><div class="big">Đang vào lớp…</div><div class="mute">Chờ một chút nhé</div></div></main>
<button id="cardBtn" style="display:none">📶 Mạng yếu quá? Dùng THẺ MÀU giơ lên</button>
<div id="cards"><div class="grid">
  <button data-c="#E5251B">A</button><button data-c="#2F7BEA">B</button><button data-c="#D9A400">C</button><button data-c="#2EAD5B">D</button>
  <button data-c="#2EAD5B" style="font-size:40px">ĐÚNG</button><button data-c="#E04A3A" style="font-size:40px">SAI</button></div>
  <button class="close" id="cardsClose">✕ Quay lại trò chơi</button><div class="full" id="cardFull"></div></div>
<script type="module">
import { makePhone, DEMO } from './phone-net.js';
import { avatar, pad, LETTERS, OPT_COLORS, GRACE_MS } from './shared.js';

const $ = id => document.getElementById(id), app = $('app');
const P = new URLSearchParams(location.search);
let g = P.get('g'), net, uid, myN = null, game = null, lastKey = '', timerRAF = 0;
const seenAt = {};      // câu hỏi -> lúc điện thoại nhận được (tự đếm giờ bằng đồng hồ trong máy)
const sent = {};        // câu hỏi -> { a, st: 'sending'|'retry'|'ok'|'denied'|'late' }

function screen(html) { app.innerHTML = html; }
function err(msg) { screen(`<div class="center"><div class="big">😵 Có lỗi kết nối</div><div class="mute">${msg}</div><button class="send" onclick="location.reload()">Thử lại</button></div>`); }

function header() {
  if (!myN) return; const a = avatar(myN);
  $('hd').style.display = 'flex'; $('hAv').style.background = a.c; $('hAv').textContent = a.e; $('hId').textContent = pad(myN);
  const r = game?.results?.[myN]; $('hSc').textContent = r ? r[0] + ' điểm' : '';
}
function showMode(m) { $('conn').innerHTML = `<span class="dot ${m === 'trực tiếp' || m === 'thử' ? 'live' : ''}"></span>${m}`; }

function render() {
  cancelAnimationFrame(timerRAF);
  header();
  $('cardBtn').style.display = myN ? 'block' : 'none';
  if (!game) return screen(`<div class="center"><div class="big">⏳ Phòng chưa mở</div><div class="mute">Thầy/cô sắp bắt đầu, giữ nguyên trang này nhé.</div></div>`);
  const s = game.state;
  if (!myN && (s === 'lobby' || s === 'question' || s === 'reveal')) return screen(`<div class="center"><div class="res">✅</div><div class="big">Đã vào lớp!</div><div class="mute">Số thứ tự và linh vật của bạn sẽ hiện ra trong giây lát.<br>Nhìn lên màn hình lớn nhé!</div></div>`);
  if (s === 'lobby') { const a = avatar(myN); return screen(`<div class="center"><div class="mute">Bạn là</div><div class="av me" style="background:${a.c}">${a.e}</div><div class="num">${pad(myN)}</div><div class="big" style="font-size:22px">Nhìn lên màn hình lớn 👀</div><div class="mute">Tìm linh vật của bạn trên màn hình.<br>Chờ thầy/cô bấm bắt đầu nhé!<br><b>Đừng tải lại trang.</b></div></div>`); }
  if (s === 'question') return renderQ();
  if (s === 'reveal' || s === 'end') return renderResult(s === 'end');
}

const RCPT = {
  sending: ['warn', '📡 Đang gửi đáp án…'],
  retry: ['warn', '📶 Mạng yếu, đang gửi lại…'],
  ok: ['ok', '✓ Máy chủ đã nhận đáp án'],
  denied: ['bad', '⚠ Máy chủ từ chối, báo thầy/cô nhé'],
  late: ['bad', '⌛ Gửi không kịp giờ'],
};
function renderSent(q) {
  const x = sent[q], Qd = game.question, [cls, txt] = RCPT[x.st];
  const opt = Qd ? Qd.options[x.a] : '';
  screen(`<div class="center"><div class="res">${x.st === 'ok' ? '✅' : x.st === 'late' || x.st === 'denied' ? '⚠️' : '✍️'}</div>
    <div class="big">Bạn chọn: ${Qd?.type === 'tf' ? opt : LETTERS[x.a] + '. ' + opt}</div>
    <div class="rcpt ${cls}">${txt}</div>
    <div class="mute">Chờ cả lớp trả lời xong…<br>Kết quả sẽ hiện ngay tại đây.</div></div>`);
}

function renderQ() {
  const q = game.q, Qd = game.question; if (!Qd) return;
  if (sent[q]) return renderSent(q);
  const tf = Qd.type === 'tf';
  screen(`<div class="qmeta"><span>CÂU ${q + 1}/${game.nq}</span><span id="tl"></span></div><div class="tbar"><i id="tb"></i></div>
    <div class="qtext">${Qd.text}</div>
    <div class="opts" style="${tf ? 'grid-template-columns:1fr 1fr' : ''}">${Qd.options.map((o, i) => tf
      ? `<button class="opt tf" data-i="${i}" style="background:${i ? '#E04A3A' : '#2EAD5B'}">${o}</button>`
      : `<button class="opt" data-i="${i}"><span class="L" style="background:${OPT_COLORS[i]}">${LETTERS[i]}</span>${o}</button>`).join('')}</div>`);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => submit(+b.dataset.i));
  const L = Qd.limit * 1000, t0 = seenAt[q] ??= Date.now();
  const tick = () => {
    const left = Math.max(0, t0 + L - Date.now());
    if ($('tb')) { $('tb').style.width = (left / L * 100) + '%'; $('tl').textContent = Math.ceil(left / 1000) + ' giây'; }
    if (left <= 0) return screen(`<div class="center"><div class="res">⌛</div><div class="big">Hết giờ!</div><div class="mute">Chờ xem đáp án trên màn hình lớn nhé.</div></div>`);
    timerRAF = requestAnimationFrame(tick);
  };
  tick();
}

function submit(a) {
  const q = game.q; if (sent[q]) return;
  sent[q] = { a, st: 'sending' };
  if (navigator.vibrate) navigator.vibrate(30);
  render();
  const deadline = (seenAt[q] ?? Date.now()) + game.question.limit * 1000 + GRACE_MS;
  net.answer(q, a, deadline, st => { sent[q].st = st; if (game && game.state === 'question' && game.q === q) renderSent(q); });
}

function renderResult(end) {
  const r = game.results?.[myN];
  if (!r) return screen(`<div class="center"><div class="big">${end ? '🏁 Kết thúc!' : '👀 Xem đáp án trên màn hình lớn'}</div><div class="mute">Bạn vào lớp sau câu này, câu tiếp theo chơi cùng nhé!</div></div>`);
  const [score, rank, last, streak, gained] = r, total = game.total || '';
  if (end) return screen(`<div class="center"><div class="res">${rank <= 3 ? ['🥇', '🥈', '🥉'][rank - 1] : '🎉'}</div><div class="big">Hạng ${rank}${total ? ' / ' + total : ''}</div><div class="pts">${score} điểm</div><div class="mute">Cảm ơn bạn đã chơi!<br>Nhìn lên màn hình lớn xem ô chữ bí ẩn nhé 🔠</div></div>`);
  if (navigator.vibrate) navigator.vibrate(last === 1 ? [40, 60, 40] : 120);
  screen(`<div class="center">${last === 1 ? `<div class="res">✅</div><div class="big ok">Chính xác!</div><div class="pts">+${gained}</div>${streak >= 2 ? `<div class="big" style="font-size:22px">🔥 Chuỗi ${streak} câu đúng!</div>` : ''}`
    : last === 0 ? `<div class="res">❌</div><div class="big bad">Chưa đúng rồi</div><div class="pts">+${gained}</div><div class="mute">Vẫn có điểm tham gia! Xem đáp án đúng trên màn hình lớn nhé.</div>`
    : `<div class="res">⌛</div><div class="big">Câu này chưa tính điểm cho bạn</div>${sent[game.q] ? '<div class="mute">Đáp án tới máy chủ sau khi hết giờ.</div>' : ''}`}
    <div class="rank">Hạng hiện tại: <b>${rank}</b>${total ? ' / ' + total : ''} · ${score} điểm</div></div>`);
}

/* ---- thẻ màu dự phòng (không cần mạng) ---- */
$('cardBtn').onclick = () => $('cards').classList.add('on');
$('cardsClose').onclick = () => $('cards').classList.remove('on');
$('cards').querySelectorAll('.grid button').forEach(b => b.style.background = b.dataset.c);
$('cards').querySelectorAll('.grid button').forEach(b => b.onclick = () => { const f = $('cardFull'); f.style.background = b.dataset.c; f.textContent = b.textContent; f.style.fontSize = b.textContent.length > 1 ? '22vw' : '40vw'; f.style.display = 'flex'; });
$('cardFull').onclick = () => { $('cardFull').style.display = 'none'; };

async function boot() {
  if (!g) {
    screen(`<div class="center">
      <div class="card-pick"><div class="big" style="font-size:24px">👩‍🏫 Thầy/cô giảng viên?</div>
        <div class="mute">Đây là trang của sinh viên. Màn hình chiếu lên hội trường nằm ở nút dưới đây.</div>
        <a class="send" href="host.html${DEMO && P.has('demo') ? '?demo=1' : ''}" style="text-decoration:none;display:block">MỞ MÀN HÌNH LỚN ▶</a></div>
      <div class="card-pick"><div class="big" style="font-size:24px">🎒 Sinh viên</div>
        <div class="mute">Cách nhanh nhất là <b>quét mã QR</b> trên màn hình lớn.<br>Quét lỗi thì nhập <b>mã phòng</b> (4 số ở góc trên bên phải màn hình lớn, không phải mật khẩu):</div>
        <input id="code" inputmode="numeric" maxlength="4" placeholder="VD: 4821"><button class="send" id="go">VÀO LỚP</button></div></div>`);
    await new Promise(res => $('go').onclick = () => { const v = $('code').value.trim(); if (/^\d{4}$/.test(v)) { g = v; history.replaceState(null, '', '?g=' + v + (DEMO ? '&demo=1' : '')); res(); } });
    screen(`<div class="center"><div class="big">Đang vào lớp…</div></div>`);
  }
  net = makePhone(g);
  net.onMode = showMode; showMode(net.mode);
  uid = await net.signIn();
  net.onState(d => {
    if (d && d.state === 'question' && seenAt[d.q] === undefined) seenAt[d.q] = Date.now();
    const k = d ? [d.state, d.q, d.results && myN && d.results[myN] ? d.results[myN].join() : '-'].join(':') : 'none';
    game = d;
    if (k !== lastKey) { lastKey = k; render(); }
  });
  // hết giờ mà màn hình lớn vẫn chưa công bố -> hỏi lại máy chủ cho chắc (phòng kênh trực tiếp bị "đứng")
  setInterval(() => {
    if (game?.state === 'question' && seenAt[game.q] && Date.now() > seenAt[game.q] + game.question.limit * 1000 + 4000) net.wantPoll = () => true;
  }, 3000);
  net.watch();
  await net.join();
  net.waitNumber(n => { myN = n; render(); });
}
boot().catch(e => err(e.message || e));
</script>
</body></html>
